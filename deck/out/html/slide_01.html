.ic{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;flex:none}
ul.dots{list-style:none}

ul.dots li::before{content:"";position:absolute;left:4px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--c,#3987e5)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);font-size:21px;color:#f0efec;white-space:nowrap}
.chip svg{flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:18px;font-weight:600;letter-spacing:.02em}
.muted{color:#8b8f98}
.t2{color:#c3c2b7}
